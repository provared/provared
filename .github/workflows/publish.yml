# Publishes a new version of Provared from the founder's signed tag.
#
# When: only when a tag whose name begins with "v" is pushed, such as
# v0.7.0. Nothing else starts it: no button, no schedule, no pull request.
#
# What it does, in order. Every step must pass before the next starts, and
# nothing is published until all the checks, the tests and the builds have
# passed:
#
#   1. check: the tag is signed by the founder's release key and by
#      nothing else (tools/release/verify-tag.mjs, with the one public key
#      in .github/release-signers); the tag's version is the version in
#      package.json and python/pyproject.toml, and the change log's newest
#      heading names it (tools/release/check-versions.mjs); and each
#      registry is asked what it already holds (tools/release/plan.mjs).
#   2. tests: the JavaScript library's tests, the Python library's tests on
#      the oldest and the newest Python it supports, and the tests of every
#      framework package, published by this run or not, against the library
#      from the tagged commit. (The full set of tests already runs on main:
#      .github/workflows/tests.yml.)
#   3. build: the checking page as one file, and the Python packages. A
#      framework package whose version is already on the Python Package
#      Index is built and compared with the published one, and the run
#      stops if its code differs (tools/release/compare_wheel.py). The
#      SHA-256 of every file built is kept, and checked again before
#      anything is published.
#   4. publish, each through the registry's trusted publishing. No password
#      or token is stored anywhere: each registry trusts this file in this
#      repository, run for the environment "release", and gives the run a
#      short-lived permission of its own.
#      - npm: the package is staged ("npm stage publish"), not published.
#        It becomes public only when the founder approves it on
#        npmjs.com, which asks for the founder's passkey. Nothing in this
#        workflow, and no token, can approve it. The run shows the stage ID
#        and the package's integrity value, so that the founder approves
#        that stage and no other. The provenance is recorded at staging.
#      - the Python Package Index: the packages not yet on the index are
#        published at once, each file with an attestation. The index has
#        no approval step.
#   5. release: the GitHub release for the tag, with the checking page as
#      one file attached and its SHA-256 in the text, which is made from
#      the change log (tools/release/release-notes.mjs).
#
# A version already on a registry is not published again, so a run that
# stopped part of the way can be started again with "Re-run all jobs". An
# upload to the Python Package Index that stopped part of the way is
# completed with "Re-run failed jobs": the same files are uploaded again,
# and the index is expected to accept a file it already holds unchanged and
# to refuse one that differs. A version staged on npm and not yet approved
# cannot be staged again: approve it, or reject it, before a run is started
# again.
#
# The files the build makes are kept with the run for 7 days
# (retention-days), so a job can be started again within that time.
#
# Permissions: none for the workflow as a whole; each job asks for the
# least it needs. Only the two publishing jobs may ask for an identity
# token (id-token: write), and only the release job may write to the
# repository (contents: write, to make the release).
#
# The actions are GitHub's own, each pinned to the exact commit of a
# released version (the comment gives the version), so that a later change
# to a tag cannot change what runs here. The one exception is the Python
# Packaging Authority's action for publishing to the Python Package Index,
# which the index names as the stable way to use trusted publishing; it is
# pinned in the same way.

name: Publish a release

on:
  push:
    tags: ['v*']

permissions: {}

# Two runs for the same tag never run at once; a second one waits.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  check:
    name: Check the tag, the versions and the registries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.versions.outputs.version }}
      npm: ${{ steps.plan.outputs.npm }}
      python: ${{ steps.plan.outputs.python }}
      python_present: ${{ steps.plan.outputs.python_present }}
      python_names: ${{ steps.plan.outputs.python_names }}
      python_kept: ${{ steps.plan.outputs.python_kept }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkout gives the tag only as a bare name for its commit. The
      # signed tag object itself is fetched here, from this public
      # repository, so that its signature can be checked.
      - name: Fetch the signed tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Note the commit being released
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag's signature
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release/verify-tag.mjs "$TAG" "$(git rev-parse HEAD)"
      - name: Check the versions and the change log
        id: versions
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release/check-versions.mjs "$TAG"
      - name: Ask the registries what they already hold
        id: plan
        run: node tools/release/plan.mjs

  test-javascript:
    name: Test the JavaScript library
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure this is the commit that was checked
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run the tests
        run: node --disable-warning=ExperimentalWarning --test 'test/**/*.test.mjs'

  test-python:
    name: Test the Python packages (Python ${{ matrix.python }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure this is the commit that was checked
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test the library
        run: |
          python -m venv "$RUNNER_TEMP/library"
          "$RUNNER_TEMP/library/bin/python" -m pip install ./python
          cd python && "$RUNNER_TEMP/library/bin/python" -m unittest discover -s tests
      # Every framework package, whether this run publishes it or not,
      # beside the library from this commit, in an environment of its own,
      # with the newest release of its framework that its bounds allow. A
      # framework package already on the index at its version is tested
      # too, so that a new library that breaks it stops the release.
      - name: Test every framework package against this library
        env:
          PUBLISH: ${{ needs.check.outputs.python }}
          PRESENT: ${{ needs.check.outputs.python_present }}
        run: |
          python -c 'import json, os; print("\n".join(f for f in json.loads(os.environ["PUBLISH"]) + json.loads(os.environ["PRESENT"]) if f != "python"))' > "$RUNNER_TEMP/frameworks.txt"
          if [ ! -s "$RUNNER_TEMP/frameworks.txt" ]; then echo "::error::No framework package was found to test."; exit 1; fi
          while read -r folder; do
            echo "Testing $folder"
            python -m venv "$RUNNER_TEMP/env-${folder##*/}"
            "$RUNNER_TEMP/env-${folder##*/}/bin/python" -m pip install ./python "./$folder"
            "$RUNNER_TEMP/env-${folder##*/}/bin/python" -m pip list
            (cd "$folder" && "$RUNNER_TEMP/env-${folder##*/}/bin/python" -m unittest discover -s tests)
          done < "$RUNNER_TEMP/frameworks.txt"

  build:
    name: Build the checking page and the Python packages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      page_sha256: ${{ steps.page.outputs.sha256 }}
      python_sha256: ${{ steps.python.outputs.sha256 }}
      # The attempt of the run that built the files, which names the
      # artifacts: a job started again with "Re-run failed jobs" downloads
      # the files of the attempt that built them, and a run started again
      # with "Re-run all jobs" builds and names its own.
      attempt: ${{ steps.attempt.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure this is the commit that was checked
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Note the attempt that builds the files
        id: attempt
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ ! "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then echo "::error::The run's attempt number is not a whole number."; exit 1; fi
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build the checking page as one file
        id: page
        run: |
          node tools/make-single-page.mjs
          mkdir -p page-out && mv provared-check.html page-out/
          echo "sha256=$(sha256sum page-out/provared-check.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          sha256sum page-out/provared-check.html
      # The build tool and setuptools at exact versions, so that a new
      # release of either cannot change what is built without a change here.
      - name: Install the Python build tool
        run: |
          echo 'setuptools==84.0.0' > "$RUNNER_TEMP/constraints.txt"
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install build==1.6.1
      - name: Build the Python packages
        id: python
        env:
          PUBLISH: ${{ needs.check.outputs.python }}
          PRESENT: ${{ needs.check.outputs.python_present }}
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        run: |
          python -c 'import json, os; print("\n".join(json.loads(os.environ["PUBLISH"])))' > "$RUNNER_TEMP/publish.txt"
          python -c 'import json, os; print("\n".join(json.loads(os.environ["PRESENT"])))' > "$RUNNER_TEMP/present.txt"
          mkdir -p dist
          while read -r folder; do
            [ -n "$folder" ] || continue
            "$RUNNER_TEMP/build/bin/python" -m build --outdir dist "$folder"
          done < "$RUNNER_TEMP/publish.txt"
          # Already on the index at this version: built only to be compared.
          while read -r folder; do
            [ -n "$folder" ] || continue
            rm -rf "$RUNNER_TEMP/compare" && mkdir -p "$RUNNER_TEMP/compare"
            "$RUNNER_TEMP/build/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/compare" "$folder"
            python -I tools/release/compare_wheel.py "$RUNNER_TEMP"/compare/*.whl
          done < "$RUNNER_TEMP/present.txt"
          ls -l dist
          # The SHA-256 of every file built, as one line of
          # "fingerprint:name" separated by commas, for the publishing job to
          # check the files it downloads against. A name of any other form
          # stops the run.
          shopt -s nullglob
          hashes=""
          for path in dist/*; do
            name="${path#dist/}"
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then echo "::error::A built file has a name of an unexpected form."; exit 1; fi
            hash="$(sha256sum -- "$path" | cut -d' ' -f1)"
            echo "$hash  $name"
            hashes="${hashes:+$hashes,}$hash:$name"
          done
          echo "sha256=$hashes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checking-page-${{ steps.attempt.outputs.attempt }}
          path: page-out/provared-check.html
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.check.outputs.python != '[]'
        with:
          name: python-packages-${{ steps.attempt.outputs.attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Stage on npm
    needs: [check, test-javascript, test-python, build]
    if: needs.check.outputs.npm == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/provared
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure this is the commit that was checked
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later, and staged publishing
      # npm 11.15.0 or later.
      - name: Check the version of npm
        run: |
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (!(a > 11 || (a === 11 && b >= 15))) { console.error("npm " + process.argv[1] + " is older than 11.15.0, the first with staged publishing."); process.exit(1); }' "$(npm --version)"
          npm --version
      # Staged, not published: the version becomes public only when the
      # founder approves it on npmjs.com with their passkey. The package has
      # no dependencies and no scripts; --ignore-scripts makes sure that
      # nothing in it is run while it is staged. --provenance asks npm to
      # record where it was built: the record (an entry in Sigstore's public
      # log) is made here, when the version is staged, before the founder
      # approves it, and stays even if the founder rejects it.
      # --json makes npm's answer readable: it gives the stage ID and the
      # package's integrity value, which the next step shows.
      - name: Stage the package
        run: |
          if ! npm stage publish --access public --ignore-scripts --provenance --json > "$RUNNER_TEMP/stage.json"; then cat "$RUNNER_TEMP/stage.json"; exit 1; fi
          cat "$RUNNER_TEMP/stage.json"
      # The stage ID and the integrity value, in a notice and in the job's
      # summary, so that the founder approves this stage and no other.
      - name: Say what was staged, and what is left to do
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node tools/release/stage-summary.mjs "$RUNNER_TEMP/stage.json" "$VERSION"

  publish-pypi:
    name: Publish to the Python Package Index
    needs: [check, test-javascript, test-python, build]
    if: needs.check.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/provared/
    permissions:
      id-token: write
    steps:
      # Only the files the build job made: nothing from the repository is
      # run in the job that holds the permission to publish.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-packages-${{ needs.build.outputs.attempt }}
          path: dist/
      # The files must be exactly those the build job made: the same names,
      # no more and no fewer, each with the SHA-256 it recorded.
      - name: Check the files against the build job's fingerprints
        env:
          EXPECTED: ${{ needs.build.outputs.python_sha256 }}
        run: |
          entry='[0-9a-f]{64}:[A-Za-z0-9][A-Za-z0-9._+-]*'
          if [[ ! "$EXPECTED" =~ ^${entry}(,${entry})*$ ]]; then echo "::error::The build job's list of fingerprints is missing or of an unexpected form."; exit 1; fi
          printf '%s\n' "$EXPECTED" | tr ',' '\n' | sed 's/:/  /' > "$RUNNER_TEMP/expected.sha256"
          if ! (cd dist && sha256sum --check --strict "$RUNNER_TEMP/expected.sha256"); then echo "::error::A downloaded file does not have the SHA-256 the build job recorded."; exit 1; fi
          expected_names="$(cut -d' ' -f3- "$RUNNER_TEMP/expected.sha256" | LC_ALL=C sort)"
          found_names="$(cd dist && find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$expected_names" != "$found_names" ]; then echo "::error::The downloaded files are not exactly the files the build job made."; exit 1; fi
          ls -l dist
      # No skip-existing: it could hide a different file of the same name.
      # An upload that stopped part of the way is completed by running this
      # job again ("Re-run failed jobs"): it uploads the same files again,
      # and the index is expected to accept a file it already holds
      # unchanged and to refuse one that differs.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true

  release:
    name: Make the GitHub release
    needs: [check, test-javascript, test-python, build, publish-npm, publish-pypi]
    # Runs once every check, test and build has passed, and each publishing
    # job has either passed or had nothing to publish.
    if: >-
      always()
      && needs.check.result == 'success'
      && needs.test-javascript.result == 'success'
      && needs.test-python.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make sure this is the commit that was checked
        env:
          COMMIT: ${{ needs.check.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checking-page-${{ needs.build.outputs.attempt }}
          path: page-out/
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.build.outputs.page_sha256 }}
          NPM_STAGED: ${{ needs.publish-npm.result == 'success' }}
          NPM_PRESENT: ${{ needs.check.outputs.npm == 'present' }}
          PYTHON_PUBLISHED: ${{ needs.publish-pypi.result == 'success' && needs.check.outputs.python_names || '' }}
          PYTHON_KEPT: ${{ needs.check.outputs.python_kept }}
        run: |
          echo "$SHA256  page-out/provared-check.html" | sha256sum --check --strict
          node tools/release/release-notes.mjs "$TAG" "$SHA256" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::The release $TAG already exists; it is left as it is."
            exit 0
          fi
          gh release create "$TAG" page-out/provared-check.html --repo "$GITHUB_REPOSITORY" --verify-tag --title "Provared $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
