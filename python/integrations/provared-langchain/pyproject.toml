[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provared-langchain"
version = "0.1.0"
description = "A LangChain middleware that checks each tool call of an agent against the permission a person signed, and records it with Provared. Evidence, not a verdict."
readme = "README.md"
authors = [{ name = "Pavel Izmaylov" }]
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt"]
keywords = ["langchain", "langchain-middleware", "ai-agent", "agent", "audit-trail", "permission", "authorization", "receipt", "tamper-evident", "passkey", "evidence"]
requires-python = ">=3.11"
# Provared itself, LangChain's agents with middleware, as tested, and the
# two packages beneath LangChain that this one imports directly.
dependencies = ["provared>=0.2.0", "langchain>=1.4,<2", "langchain-core>=1.6,<2", "pydantic>=2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://prova.red"
Source = "https://github.com/provared/provared"
Documentation = "https://github.com/provared/provared/tree/main/python/integrations/provared-langchain"
Issues = "https://github.com/provared/provared/issues"

[tool.setuptools.packages.find]
where = ["src"]
