[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provared-hermes"
version = "0.1.0"
description = "A Hermes Agent plugin that checks each tool call against the permission a person signed, and records it with Provared. Evidence, not a verdict."
readme = "README.md"
authors = [{ name = "Pavel Izmaylov" }]
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt"]
keywords = ["hermes-agent", "hermes-plugin", "ai-agent", "agent", "audit-trail", "permission", "authorization", "receipt", "tamper-evident", "passkey", "evidence"]
requires-python = ">=3.11"
# Provared itself, from the version whose stub writer in Python goes on
# after a seal, to the next version that may change its interface (tested
# with 0.4.0 and 0.5.0). Hermes
# is not named here: it is installed by its own installer, not from the
# Python Package Index (whose "hermes-agent" stopped at 0.19.0, which
# cannot be installed beside Provared). Hermes reads this list when the
# plugin is installed as a folder.
dependencies = ["provared>=0.4.0,<0.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://prova.red"
Source = "https://github.com/provared/provared"
Documentation = "https://github.com/provared/provared/tree/main/python/integrations/provared-hermes"
Issues = "https://github.com/provared/provared/issues"

# Installed with pip, Hermes finds the plugin by this name.
[project.entry-points."hermes_agent.plugins"]
provared = "provared_hermes:register"

[tool.setuptools.packages.find]
where = ["src"]
