[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provared"
version = "0.3.0"
description = "Proof of what an AI agent was allowed to do, and what it then did. A passkey-signed permission with limits a machine can check, a signed receipt for each action, and a checker. Evidence, not a verdict."
keywords = ["ai-agent", "agent", "audit-trail", "permission", "authorization", "receipt", "tamper-evident", "passkey", "webauthn", "jws", "ed25519", "ml-dsa", "post-quantum", "evidence", "langchain"]
readme = "README.md"
authors = [{ name = "Pavel Izmaylov" }]
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt"]
requires-python = ">=3.11"
# The one dependency: Python has no signatures built in. Version 48.0.0 is
# the first whose ready-built packages hold ML-DSA (FIPS 204).
dependencies = ["cryptography>=48"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://prova.red"
Source = "https://github.com/provared/provared"
Documentation = "https://github.com/provared/provared/tree/main/python"
Issues = "https://github.com/provared/provared/issues"

[tool.setuptools.packages.find]
where = ["src"]
